<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0D;
    --panel:#17171A;
    --line:#2E2E33;
    --gold:#C9A227;
    --gold-dim:#8A7A4A;
    --cream:#F1EEE6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,39,0.14) 0%, rgba(11,11,13,0) 55%),
      var(--ink);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:44px 24px 28px;
    overflow-x:hidden;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:32px;
  }

  .wing{ width:64px; height:64px; }
  .wing svg{ width:100%; height:100%; }

  header{ text-align:center; }
  .eyebrow{
    font-size:10.5px;
    letter-spacing:0.26em;
    color:var(--gold-dim);
    text-transform:uppercase;
    margin-bottom:8px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:38px;
    letter-spacing:0.03em;
    color:var(--cream);
  }
  .sub{
    margin-top:6px;
    font-size:13px;
    color:var(--gold-dim);
    letter-spacing:0.02em;
  }

  nav{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--cream);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.01em;
    transition:transform .15s ease;
  }
  a.btn:active{ transform:scale(0.98); }
  a.btn .icon{
    width:22px; height:22px; flex:none;
    color:var(--gold);
  }
  a.btn.primary{
    background:linear-gradient(180deg, #D8B84A, var(--gold));
    border:none;
    color:#0B0B0D;
    font-weight:600;
  }
  a.btn.primary .icon{ color:#0B0B0D; }

  footer{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .tagline{
    font-size:12px;
    color:var(--gold-dim);
    letter-spacing:0.03em;
  }
  .mark{
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.2em;
    color:var(--gold);
    text-transform:uppercase;
  }
</style>
</head>
<body>

  <div class="content">
    <div class="wing">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 6 L36 30 L58 40 L58 44 L36 38 L36 50 L44 56 L44 59 L32 56 L20 59 L20 56 L28 50 L28 38 L6 44 L6 40 L28 30 Z" fill="#C9A227"/>
      </svg>
    </div>

    <header>
      <div class="eyebrow">Vuelos privados &amp; aviación ejecutiva</div>
      <h1>Sky Flight</h1>
      <div class="sub">Elevating the way you fly</div>
    </header>

    <nav>
      <!-- EDITAR: reemplazar con el numero real de WhatsApp de Sky Flight -->
      <a class="btn" href="https://wa.me/521XXXXXXXXXX" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.36 5.07L2 22l5.06-1.33C8.51 21.5 10.2 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.6 0-3.1-.44-4.38-1.2l-.31-.18-3.07.81.82-3-.2-.32A7.94 7.94 0 0 1 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8-3.59 8-8 8zm4.4-5.6c-.24-.12-1.43-.7-1.65-.78-.22-.08-.38-.12-.55.12-.16.24-.63.78-.77.94-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.02-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.33-.76-1.82-.2-.48-.4-.42-.55-.42-.14 0-.3-.02-.46-.02s-.42.06-.64.3c-.22.24-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.43-.58 1.63-1.15.2-.56.2-1.04.14-1.15-.06-.1-.22-.16-.46-.28z"/></svg>
        WhatsApp
      </a>

      <a class="btn" href="https://instagram.com/skyflight.global" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.76 1.15.55.55.9 1.1 1.15 1.76.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.76 4.9 4.9 0 0 1-1.76 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.76-1.15 4.9 4.9 0 0 1-1.15-1.76c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.76A4.9 4.9 0 0 1 5.44.54C6.08.29 6.81.12 7.87.07 8.94.02 9.28 0 12 0zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 8.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm6.4-8.4a1.2 1.2 0 1 1-2.4 0 1.2 1.2 0 0 1 2.4 0z"/></svg>
        Instagram
      </a>

      <!-- EDITAR: reemplazar con el usuario real de TikTok -->
      <a class="btn" href="https://tiktok.com/@skyflight.global" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3.2v13.6a2.9 2.9 0 1 1-2.05-2.77V9.5a6.3 6.3 0 1 0 5.25 6.2V8.9a7.5 7.5 0 0 0 4.4 1.4V6.9a4.4 4.4 0 0 1-4.4-4.4V2z"/></svg>
        TikTok
      </a>

      <!-- EDITAR: reemplazar con el link real de reseña (search.google.com/local/writereview?placeid=...) -->
      <a class="btn primary" href="https://search.google.com/local/writereview?placeid=REEMPLAZAR" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7L5.8 21l1.6-7L2 9.2l7.1-.6L12 2z"/></svg>
        Déjanos tu reseña en Google
      </a>
    </nav>

    <footer>
      <div class="tagline">Un toque. Cinco estrellas.</div>
      <div class="mark">AsterTap MX</div>
    </footer>
  </div>

</body>
</html>
