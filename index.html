<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0D;
    --panel:#17171A;
    --line:#2E2E33;
    --gold:#C9A557;
    --gold-light:#E9D08A;
    --gold-dark:#9C7A3E;
    --gold-dim:#9C8A5C;
    --cream:#F1EEE6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,165,87,0.14) 0%, rgba(11,11,13,0) 55%),
      var(--ink);
    color:var(--cream);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:44px 24px 28px;
    overflow-x:hidden;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
  }

  .wing{ width:180px; height:74px; margin-bottom:-6px; }

  header{ text-align:center; }
  .eyebrow{
    font-size:10.5px;
    letter-spacing:0.26em;
    color:var(--gold-dim);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:38px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    background:linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1.1;
  }
  .sub{
    margin-top:8px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:15px;
    color:var(--gold-dim);
    letter-spacing:0.02em;
  }

  nav{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  a.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:16px 18px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--cream);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    letter-spacing:0.01em;
    transition:transform .15s ease;
  }
  a.btn:active{ transform:scale(0.98); }
  a.btn .icon{
    width:22px; height:22px; flex:none;
    color:var(--gold);
  }
  a.btn.primary{
    background:linear-gradient(180deg, var(--gold-light), var(--gold-dark));
    border:none;
    color:#0B0B0D;
    font-weight:600;
  }
  a.btn.primary .icon{ color:#0B0B0D; }

  footer{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .tagline{
    font-size:12px;
    color:var(--gold-dim);
    letter-spacing:0.03em;
  }
  .mark{
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.2em;
    color:var(--gold);
    text-transform:uppercase;
  }
</style>
</head>
